http {
    # Задаём зону и параметры лимитирования (10 запросов в минуту на IP)
    limit_req_zone $binary_remote_addr zone=my_zone:10m rate=10r/m;

    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применяем лимит в данном location:
            # burst=2 (например) разрешает небольшое превышение,
            # nodelay означает, что при превышении лимита Nginx сразу возвращает ошибку
            limit_req zone=my_zone burst=2 nodelay;
            limit_req_status 429;

            # Добавляем заголовки для информирования клиента о лимите и времени ожидания
            add_header X-RateLimit-Limit "10 req/min";
            add_header Retry-After "60";

            proxy_pass http://backend_servers;
        }
    }
}
